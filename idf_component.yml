description: "Arduino core for ESP32, ESP32-C, ESP32-H, ESP32-P, ESP32-S series of SoCs"
url: "https://github.com/espressif/arduino-esp32"
license: "LGPL-2.1"
targets:
  - esp32
tags:
  - arduino
files:
  include:
    - "variants/esp32/**/*"
  exclude:
    - ".*" # All files in the root directory that start with a dot.
    - ".gitlab/"
    - ".gitlab/**/*"
    - "docs/"
    - "docs/**/*"
    - "idf_component_examples/"
    - "idf_component_examples/**/*"
    - "package/"
    - "package/**/*"
    - "tests/"
    - "tests/**/*"
    - "tools/"
    - "tools/**/*"
    - "variants/**/*"
    - "boards.txt"
    - "CODE_OF_CONDUCT.md"
    - "LICENSE.md"
    - "package.json"
    - "platform.txt"
    - "programmers.txt"
dependencies:
  idf: ">=5.3,<6.2"
  espressif/mdns:
    version: "^1.11.2"
    require: public
  espressif/libsodium:
    version: "^1.0.22"
    require: public
    rules:
      - if: idf_version < 6.0
  joltwallet/littlefs:
    version: "^1.22.1"
examples:
  - path: ./idf_component_examples/Arduino_ESP_Matter_over_OpenThread
  - path: ./idf_component_examples/hello_world
  - path: ./idf_component_examples/hw_cdc_hello_world
